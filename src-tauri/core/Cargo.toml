[package]
name = "texturium-core"
version = "0.1.0"
edition = "2021"
description = "The storage side of the desktop apps: record store, files, path rules, library folder, handles. No Tauri code."

[lib]
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs4 = "0.13"

[dev-dependencies]
tempfile = "3"

# Tests live in tests/src-tauri/ at the repository root (storage-backends test plan).
[[test]]
name = "paths"
path = "../../tests/src-tauri/paths.rs"

[[test]]
name = "files"
path = "../../tests/src-tauri/files.rs"

[[test]]
name = "handles"
path = "../../tests/src-tauri/handles.rs"

[[test]]
name = "library"
path = "../../tests/src-tauri/library.rs"

[[test]]
name = "db_atomicity"
path = "../../tests/src-tauri/db_atomicity.rs"

[[test]]
name = "errors"
path = "../../tests/src-tauri/errors.rs"
